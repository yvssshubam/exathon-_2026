# Account scoring v2 (docs/DECISIONS.md D-57 to D-59). The score answers one question for the bank: how much should we
# hold on this account, and can we defend it? It never says the holder is a criminal.
#
# Two scores per account, each the weighted average of its signals' m values:
#   pass_through     does money run straight through the account?   (P1..P5)
#   fraud_exposure   does the account keep getting fraud money?      (E1, E2, E3, E5)
# Each signal is computed in SQL (sql/steps/060_score.sql) over the 90 days before the decision, from this bank's own
# transactions, and turned into m in [0, 1]: a straight line from `low_at` (m = 0) to `high_at` (m = 1), clamped.
# A signal that cannot be measured counts as m = 0, so a gap can only send a case to the officer, never cause a hold.
#
# The weights are learned (D-58): `start_weight` is version 0; the live weights are read from the SCORING_WEIGHTS
# table, which `python -m pipeline.weights` fills with a new version only after the gate and a person's approval.
# What each signal measures, its low and high points, the cut-offs, E4 and the ladder stay set by policy, here.
#
# Sentences: `high_sentence` is used when m >= 0.5, `low_sentence` otherwise. Placeholders filled in SQL:
#   {v} value rounded to a whole number   {v1} one decimal   {pct} value x 100, whole number
# The facts never say "mule", "criminal" or "fraudster": the type names a pattern of money, never the holder.

version: 2
window_days: 90

cutoffs:
  high_at: 0.60          # a score at or above this is high
  low_below: 0.40        # a score below this is low; anything in between is the grey zone (the officer decides)

account_types:           # pass_through x fraud_exposure -> type (070_actions.sql, config/rules.yaml account_types)
  PIPE_FOR_FRAUD:    {pass_through: high, fraud_exposure: high, name: "Pipe for fraud"}
  FAST_MOVER:        {pass_through: high, fraud_exposure: low,  name: "Fast mover"}
  EXPOSED_BUSINESS:  {pass_through: low,  fraud_exposure: high, name: "Exposed business"}
  ORDINARY_CUSTOMER: {pass_through: low,  fraud_exposure: low,  name: "Ordinary customer"}
  GREY_ZONE:         {name: "Grey zone"}

pass_through:
  median_dwell_minutes:            # P1: for each credit, minutes until the next debit (NACH and AutoPay left out); median
    low_at: 360
    high_at: 30
    start_weight: 0.25
    high_sentence: "Money it receives usually leaves within {v} minutes."
    low_sentence: "Money it receives usually stays for hours or days (median {v} minutes)."
  passed_on_within_hour:           # P2: part of each credit sent on within 60 minutes (matched once), over all credits
    low_at: 0.20
    high_at: 0.80
    start_weight: 0.30
    high_sentence: "{pct}% of the money it received was sent on within an hour."
    low_sentence: "Only {pct}% of the money it received was sent on within an hour."
  cashed_out_within_hour:          # P3: part of each credit taken out as ATM cash, cash or crypto within 60 minutes
    low_at: 0.05
    high_at: 0.50
    start_weight: 0.20
    high_sentence: "{pct}% of the money it received was taken out as cash or crypto within an hour."
    low_sentence: "Only {pct}% of the money it received was taken out as cash or crypto within an hour."
  balance_kept_ratio:              # P4: balance at the decision / the victim money that came in
    low_at: 5.0
    high_at: 0.05
    start_weight: 0.15
    high_sentence: "Its balance is now only {v1} times the victim money it received."
    low_sentence: "Its balance stayed far above the victim money it received ({v} times larger)."
  top3_payer_share:                # P5: share of money received from the top 3 payers, NACH credits left out
    low_at: 0.20
    high_at: 0.80
    start_weight: 0.10
    skip_nach_credits: true
    high_sentence: "{pct}% of the money it received came from just three payers."
    low_sentence: "It is paid by many different payers ({pct}% from its top three), like a shop."

fraud_exposure:
  direct_complaints_7d:            # E1: distinct complaints whose victim paid straight into the account, last 7 days
    low_at: 1
    high_at: 3
    start_weight: 0.25
    high_sentence: "{v} different fraud complaints paid straight into it in the last 7 days."
    low_sentence: "At most one fraud complaint paid straight into it in the last 7 days."
  trail_touches_90d:               # E2: distinct complaints whose traced trail passed through it (30 days 1, older 0.5)
    low_at: 1
    high_at: 4
    start_weight: 0.25
    recent_days: 30
    older_counts_as: 0.5
    high_sentence: "The traced money of {v1} fraud complaints passed through it in the last 90 days."
    low_sentence: "The traced money of at most one fraud complaint passed through it in the last 90 days."
  money_from_flagged_share:        # E3: money from flagged accounts / all money received, NACH credits left out
    low_at: 0.02
    high_at: 0.25
    start_weight: 0.35
    skip_nach_credits: true
    high_sentence: "{pct}% of the money it received came from accounts under a police notice or in the Suspect Registry."
    low_sentence: "Only {pct}% of the money it received came from accounts under a police notice or in the Suspect Registry."
  pays_back_its_payers:            # E5: share of the accounts it paid that also paid it
    low_at: 0.10
    high_at: 0.50
    start_weight: 0.15
    high_sentence: "{pct}% of the accounts it paid also paid it."
    low_sentence: "Only {pct}% of the accounts it paid also paid it."

# E4 is not part of either score: it decides the freeze ladder (D-59).
fast_exit_check:
  fraud_money_out_within_hour_at_least: 0.50
  gap_over_other_money_at_least: 0.30
  thin_evidence_below_payments: 3

freeze_ladder:
  medium_at_cases: 2
  strong_at_cases: 3
  weak_only_if_fraud_money_share_below: 0.02
  refused_withdrawal_goes_to: strong
  nodal_pool_escrow_max_step: medium

weight_learning:                   # D-58: pipeline/weights.py and sql/udf/train_weights.py
  model: logistic_regression
  coefficients_at_least: 0
  weight_min: 0.05
  weight_max: 0.50
  signal_window_share: 0.60
  test_accounts_share: 0.30
  max_auc_drop_vs_live: 0.02
  needs_approval: true
  benchmark_model: boosted_trees
  seed: 42
  l2: 0.001

# Shown as context, never scored: who the holder is, not what the money does.
context: [account_age_days, declared_profile_band, account_type, kyc_date, salary_by_nach]

# Declared-profile bands: context only now; kept because the training features of the retired learned signal
# (sql/learn/010_features.sql) still read them.
profile_band_expected_monthly_credit_inr:
  low: 50000
  medium: 300000
  high: 5000000

# Not a score signal: a guard (SOP 9.1(i), 9.1(iii)). Never fully frozen, never an automatic hold on new money.
never_account_hold_types: [nodal, pool, escrow]

top_reasons: 3