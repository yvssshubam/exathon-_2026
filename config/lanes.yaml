# The two legal lanes a hold can belong to (requirements section 4).
# Configuration, not code: Lane B is an RBI draft and may change before 1 April 2027.
# Each deadline = anchor event + days. Anchors are explained in docs/DECISIONS.md D-12.
#
# anchor events: hold_placed, grievance_received, grievance_forwarded, explanation_received,
#                police_referred, hold_removal_due

lanes:
  A:
    name: "Police-instructed hold"
    in_force: true
    source: "MHA I4C SOP for NCRP-CFCFRMS, 2 Jan 2026 (judicially monitored, SC order 9 Feb 2026)"
    legal_basis: "S.168 read with S.94 BNSS"
    seizure_basis: "S.106 BNSS (needs an FIR)"
    account_hold_allowed: false          # account-level action needs a lawful direction or FIR (SOP 5(iv))
    holder_may_be_told: "Ordering police unit's address and contact only; never the victim's details (SOP 9.1(ii))"
    interim_custody_threshold_inr: 50000 # below: S.106(3); above: needs an FIR (SOP para 11)
    deadlines:
      - {name: trail_update_to_cfcfrms, anchor: hold_placed, days: 7, sop: "6.1(k)",
         text: "Send KYC and onward trail to CFCFRMS"}
      - {name: forward_grievance, anchor: grievance_received, days: 7, sop: "10.1(a)",
         text: "Check and forward the holder's grievance to the module"}
      - {name: officer_decision, anchor: grievance_forwarded, days: 15, sop: "10.1(d)-(f)",
         text: "Police officer decides; else auto-escalates to District Grievance Officer",
         projected_from: grievance_received}
      - {name: district_review, anchor: officer_decision_due, days: 15, sop: "10.1(f)",
         text: "District Grievance Officer review"}
      - {name: state_review, anchor: district_review_due, days: 15, sop: "10.2(g)",
         text: "State review"}
      - {name: hold_removal, anchor: grievance_received, days: 90, sop: "10.1",
         text: "Lift the hold if no lawful direction has arrived"}
      - {name: intimate_police_before_removal, anchor: hold_removal_due, days: -15, sop: "10.1",
         text: "Tell the police the hold will lapse"}
    extension_days: 90                   # police may extend once, with a reference
    bank_info_on_request_days: 2

  B:
    name: "Bank's own suspicion"
    in_force: false                      # draft; effective 1 Apr 2027 if finalised
    source: "RBI draft KYC Amendment Directions, 11 Sep 2026"
    legal_basis: "RBI draft KYC Amendment Directions (not yet in force)"
    trigger_min_inr: 1000
    account_hold_allowed: true           # suspected mule only, and only as a last resort
    account_hold_label: "last resort"
    deadlines:
      - {name: notice_to_holder, anchor: hold_placed, days: 0, text: "Tell the holder immediately, with reasons and an officer's contact"}
      - {name: customer_explanation, anchor: hold_placed, days: 20, text: "Holder may explain"}
      - {name: bank_decision_after_explanation, anchor: explanation_received, days: 10, text: "Bank decides after the explanation"}
      - {name: bank_decision_no_explanation, anchor: hold_placed, days: 30, text: "Bank decides if no explanation came"}
      - {name: police_instruction, anchor: police_referred, days: 30, text: "Police instruct after an NCRP referral"}
      - {name: max_hold_without_police, anchor: hold_placed, days: 60, text: "Hold ends unless police have instructed"}
    records_retention: "5 years from the hold, or 10 years from account closure"

warn_when_due_within_days: 3             # FR-12: flag holds due within 3 days