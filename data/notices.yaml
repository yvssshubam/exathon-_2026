# Police notices that reach Bank X's nodal desk outside the portal: by e-mail or as a letter (PDF). Synthetic.
# The agent reads each into a ticket, then works it like any other: intake checks every field against the payment in
# Exasol; the same payment as an earlier ticket is linked, never held twice; any mismatch sends it back with a letter
# that names it (pipeline/notices.py, DECISIONS D-52). Nothing is held on a notice alone.
#
#   NTC_01  e-mail, after an FIR: every field right, the day but no time   -> linked to the 13:48 complaint
#   NTC_02  letter (PDF): the amount is wrong (Rs 1,25,800; the payment is Rs 1,52,800)  -> sent back
#   NTC_03  e-mail: the UTR has two digits swapped                         -> sent back; the near match to the officer
#   NTC_04  e-mail: cites no legal provision, and asks for a whole-account freeze  -> sent back
