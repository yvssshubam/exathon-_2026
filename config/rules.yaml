# What the agent does on its own, and the four things only the officer decides (docs/DESIGN.md, "Who does what").
# Configuration, not code: sql/steps/070_actions.sql reads these values as parameters, pipeline/checker.py validates
# every proposal against them, and tests/rules_oracle.py applies the same table in plain Python.
#
# The principle: the agent does what the rules already require, instantly and at any hour; the officer decides what
# the rules leave to judgment. The model never places, sizes or releases a hold: it proposes and words things, and
# the checker (deterministic code with its own database user) is the only component that carries anything out.

lane_a:
  name: "Police-instructed hold"
  source: "MHA I4C SOP for NCRP-CFCFRMS, 2 Jan 2026 (judicially monitored, SC order 9 Feb 2026)"
  legal_basis: "S.168 read with S.94 BNSS"

# The fixed citation list behind each kind of action. Reasons cite these and nothing else: the model never writes a
# citation (docs/DESIGN.md, "Written reasons").
legal_basis:
  hold: "S.168 r/w S.94 BNSS: hold the reported amount, or the part of it available (SOP 6.1(j), 9.1(i))"
  narrow: "hold only the victim's amount (SOP 5(xii), 9.1(i); Delhi HC, Neelkanth Pharma). One fraud-linked payment does not make the holder a suspect (AP HC, 22 Jun 2026)."
  freeze: "Whole-account freeze at the bank's or IO's discretion (I4C FAQ); exceptional cases only (Rajasthan HC, 20 Aug 2026)"
  trail: "Trail update to CFCFRMS: onward transfers, exits and KYC (SOP 6.1(k), 9.1(i))"
  release: "Lifting a hold needs approval (Department Head); a hold with no police direction is reviewed, not kept by default"
  send_back: "Notice that does not match a transaction: returned for correction, nothing held (Rajasthan HC: clarify unclear notices)"
  pre_alert: "Information to CFCFRMS for the police and the payer's bank (SOP 6.1(k)): the payment is already held; nothing more is held on the alert"
  larger: "A larger lien, up to the fraud-linked money received in 90 days, never above the balance (S.168 r/w S.94 BNSS; freeze ladder, Medium)"
  rbi_draft: "Temporary debit hold on a suspicious transaction of Rs 1,000 or more flagged by the bank's own monitoring (RBI draft KYC Amendment Directions, 11 Sep 2026)"
  police_notice: "Held under the existing police notice on the account (MHA SOP for NCRP-CFCFRMS; D-47)"
  referral: "Referral of an unresolved temporary debit hold to the police through NCRP-CFCFRMS (RBI draft KYC Amendment Directions, 11 Sep 2026)"

# Automatic: the bank cannot refuse these, or they move no money, so the agent does them the moment the ticket lands.
# Filings are filed, never left as drafts: a draft onward entry sitting until 9 a.m. stalls the next bank's ticket.
automatic:
  MANDATORY_HOLD: "Own account the victim's money reached, money left: lien up to the amount the trail names, never above the balance or the reported amount"
  HOLD_MARKER: "First-layer own account with nothing left (not nodal, pool or escrow): catch later credits up to the amount the trail names"
  RECORD_EXIT: "Money left banking from an own account: file the exit with its identifiers"
  ONWARD_ENTRY: "Money moved from an own account to another bank: file the onward entry with the victim's share"
  KYC_PACKET: "File the holder's KYC for every own account held, in the same run (the SOP allows a week)"
  SEND_BACK: "The ticket does not match a transaction: return it for correction, naming only the fields that differ"
  LINK_DUPLICATE: "The same transaction reached the bank twice: link the tickets, place no second hold"
  RECORD_SPLIT: "Several victims' money in one account: record the split for the refund stage (moves no money)"
  WATCH_HOLD: "Retired by D-62 (kept so old proposals stay readable): new money is now held only as a PROACTIVE_HOLD"
  PROACTIVE_HOLD: "New money from a first-time payer into an eligible account (Layer 1 or Suspect Registry, typed Pipe for fraud or Fast mover) that passed the payment checks: hold that payment, never above its own amount or the balance (D-60 to D-62)"
  WATCH_ADD: "Add an account to the watch (a failed transfer named it), with no hold"

# The officer's five decisions. The agent prepares the proposal, the reasons and the case against; nothing changes
# until the officer approves. Nothing else ever waits for the officer.
officer:
  PROPOSE_NARROW: "Likely honest receiver, or a nodal/pool/escrow account, holding less victim money than the mandatory hold: narrow the lien to the victims' money"
  PROPOSE_FULL_FREEZE: "Mule-like account whose own behaviour shows the pattern courts accept: propose a whole-account freeze (widen), with the reasons written down"
  UNMATCHED_NOTICE: "The ticket matches no transaction exactly but a near match exists on the named account: decide what to do with it"
  PROPOSE_RELEASE: "A hold with no police direction for 75 days: decide whether to release it"
  PROPOSE_PRE_ALERT: "Retired by D-64 (kept so old proposals stay readable): pre-alerts now follow a proactive hold"
  PROPOSE_LARGER_HOLD: "The freeze ladder at Medium: fraud money leaves this account faster than its other money, in 2 to under 3 fraud cases. Hold up to the fraud-linked money of 90 days, never above the balance"

# When a full freeze may be proposed (Rajasthan HC: a deliberately operated account, or repeated credits followed by
# onward transfers). Never on a nodal, pool or escrow account; never placed without the officer.
full_freeze_evidence:
  # first pass: the freeze ladder (config/scoring.yaml freeze_ladder): Strong at 3 or more fraud cases, only once
  # fraud money is seen leaving faster than the account's other money (D-59)
  watch_cash_out_channels: [ATM, CASH, CRYPTO]   # watch: a refused withdrawal on a Pipe for fraud or Fast mover
  refused_withdrawal_types: [PIPE_FOR_FRAUD, FAST_MOVER]   # goes straight to Strong

# The watch (pipeline/watch.py). A query a minute is enough: the hold already protects the money, so a refused
# attempt is evidence for a morning decision, not an emergency.
watch:
  release_review_days: 75                # no police direction by then: one release flag to the officer
  business_holder_types: [merchant, business]   # a refused transfer to these is noted, never labelled a next mule

# What each account type may trigger on top of the mandatory hold, which every type gets (D-57). The score can stop a
# hold, never start one: it only ever makes the bank hold less than an eligible account would otherwise get.
account_types:
  PIPE_FOR_FRAUD:    {proactive: true,  shrink: never,   freeze: ladder}
  FAST_MOVER:        {proactive: true,  shrink: "no",    freeze: refused_withdrawal}
  EXPOSED_BUSINESS:  {proactive: false, shrink: officer, freeze: ladder}
  ORDINARY_CUSTOMER: {proactive: false, shrink: "yes",   freeze: never}
  GREY_ZONE:         {proactive: false, shrink: officer, freeze: officer}

# Proactive holds (D-60 to D-64). Once a victim's ticket names an account at this bank, new money from a stranger into
# it is held the moment it lands, and someone who can reach the payer is told.
proactive:
  proactive_hold_mode: rbi_draft         # rbi_draft (the RBI draft of 11 Sep 2026) or current_sop (today's SOP, D-47)
  eligible_types: [PIPE_FOR_FRAUD, FAST_MOVER]
  never_types: [nodal, pool, escrow]     # never an automatic hold on new money; the officer decides
  # the payment checks on arrival (D-61): all required
  min_amount: 1000                       # Rs 1,000 or more, the draft's threshold
  new_payer_days: 90                     # the payer has not paid this account in the previous 90 days
  skip_nach_credits: true                # NACH and UPI AutoPay credits (salary, pension, refunds, dividends) pass
  # a Fast mover is linked to one fraud case so far: one of these must also hold
  fast_mover_size_percentile: 90         # larger than 90% of the account's credits in the last 90 days
  fast_mover_recent_hours: 24            # within 24 hours of the last victim payment into the account
  # the draft's clocks (D-63), calendar days from the hold
  explanation_days: 20
  decide_days: 30
  decide_after_explanation_days: 10
  police_reply_days: 30
  must_decide_day: 50
  limit_days: 60
  next_day_check_by: "18:00"             # the next-day check is due by 18:00 on the next working day
  escalate_to: "Department Head"
  holder_contact: "Nodal Officer, Bank X, nodal.officer@bank-x.example (simulated)"
  bank_holidays:                         # with Sundays, not working days (simulated calendar)
    - {date: "2026-11-09", name: "Deepavali (simulated holiday)"}

# Never, whoever asks: the checker refuses these.
forbidden:
  - "A full freeze placed without an officer"
  - "A full freeze on a nodal, pool or escrow account"
  - "A hold above the balance, the amount the trail names or the reported amount"
  - "A hold on another bank's account"
  - "A hold without a notice behind it (Lane A only)"
  - "Any change at all when the victim's money does not reconcile to the paisa"
  - "A proposal the rules engine did not produce for these facts"

# Today's desk, for the Compare screen (each case file can override; data/demo_case.yaml does).
today_defaults:
  desk_opens: "10:00"
  first_lookup_minutes: 20
  per_account_minutes: 15
  freezes_whole_account: true
  manual_steps_per_ticket: 8             # read, pass to core banking, look up the UTR, mark the lien, type the onward
                                         # entry, type the exit, screenshot to the branch, upload the KYC
  kyc_allowed_days: 7