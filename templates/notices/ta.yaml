title: "உங்கள் கணக்கில் நிறுத்திவைப்பு (ஹோல்ட்) அறிவிப்பு"
dear: "அன்புள்ள"
reference_label: "குறிப்பு"
intro: "$txn_time அன்று உங்கள் கணக்கு $account_id இல் $txn_amount பணம் வந்தது (UTR $txn_utr). இந்தப் பணம் பதிவுசெய்யப்பட்ட ஓர் இணைய மோசடிப் புகாருடன் தொடர்புடையது."
what_label: "நாங்கள் செய்தது"
