# ग्राहक सूचना, हिंदी। Same fields as en.yaml. Drafted for the demo; to be reviewed by a native speaker before real use.
title: "आपके खाते पर रोक (होल्ड) की सूचना"
dear: "प्रिय"
reference_label: "संदर्भ"
intro: "$txn_time को आपके खाते $account_id में $txn_amount का भुगतान आया (UTR $txn_utr)। यह भुगतान दर्ज की गई एक साइबर धोखाधड़ी शिकायत से जुड़ा है।"
what_label: "हमने क्या किया"
scope_amount: "हमने केवल $hold_amount पर रोक लगाई है। आपके खाते की बाकी राशि आप सामान्य रूप से उपयोग कर सकते हैं।"
scope_account: "अंतिम उपाय के रूप में हमने आपके पूरे खाते पर रोक लगाई है।"
why_label: "क्यों"
reason_amount: "आपको मिला एक भुगतान दर्ज की गई साइबर धोखाधड़ी से जुड़ा है। ऐसा भुगतान मिलने का अर्थ यह नहीं है कि आपने कुछ गलत किया है; जाँच पूरी होने तक केवल यही राशि रोकी गई है।"
reason_account: "इस खाते में धोखाधड़ी का पैसा आगे भेजने के संकेत दिखे हैं: $signals"
who_label: "किसके कहने पर"
authority_A: "$authority (संदर्भ $reference)। इस रोक के बारे में आप उनसे संपर्क कर सकते हैं।"
authority_B: "$bank_name ने स्वयं, असामान्य लेनदेन के कारण (RBI के प्रस्तावित नियम, जो अभी लागू नहीं हैं)।"
basis_label: "कानूनी आधार"
do_label: "आप क्या कर सकते हैं"
respond_A: "यदि आपको लगता है कि यह गलत है, तो अपनी शाखा में स्पष्टीकरण और कोई प्रमाण (जैसे बिक्री का बिल) लेकर आएँ। बैंक आपकी शिकायत मिलने के 7 दिनों के भीतर पुलिस पोर्टल पर भेजेगा।"
respond_B: "आप 20 दिनों के भीतर, $respond_by तक, अपना स्पष्टीकरण दे सकते हैं। बैंक आपके स्पष्टीकरण के 10 दिनों के भीतर निर्णय लेगा।"
grievance_label: "शिकायत अधिकारी"
closing_amount: "यह सूचना आप पर धोखाधड़ी का आरोप नहीं है। रोकी गई राशि को छोड़कर आपका खाता उपयोग में रहेगा।"
closing_account: "यह सूचना आप पर धोखाधड़ी का आरोप नहीं है। आप कभी भी इस रोक की समीक्षा का अनुरोध कर सकते हैं।"