# Police notices that reach Bank X's nodal desk directly (e-mail, scanned letter), as messy text. Synthetic.
# The agent reads each one, checks it against the transactions in Exasol, and either matches it to its ticket or
# drafts a letter asking the police to correct it (pipeline/notices.py, DECISIONS D-41). Nothing is held on a
# notice alone: holds come from tickets.
