# Proactive holds (DECISIONS D-60 to D-65): the demo night's scenarios A to G at Bank X. Invented people and numbers.
# Synthetic, MIT. Hand-written (made once with a small script); IDs are stable: tests and the demo script use them.
#
#   P10  a Layer-1 account (CASE_P01, CASE_P02) that has received money from P08, which the Suspect Registry lists,
#        and sent it on within minutes, mostly to a crypto wallet: typed Pipe for fraud once its second complaint lands
#   P20  a Layer-1 account (CASE_P05) that sends money on within minutes, with no fraud money before: a Fast mover
#   P07  a Layer-1 account (CASE_P04), also in the Suspect Registry: flagged
#   P08  at Bank Y, in the Suspect Registry, no ticket: Bank X sees only its payments to P10
#
#   00:20  victim P1 pays P10 Rs 60,000; 8 minutes later Rs 25,000 leaves for a crypto wallet; CASE_P01 lands at 00:45
#   00:50  victim P2 pays P10 Rs 25,000: P10 is in the grey zone after one complaint, so nothing is held on arrival;
#          CASE_P02 lands at 01:05 and holds it; P10 is now typed Pipe for fraud
#   01:30  victim P5 pays P20 Rs 80,000; Rs 50,000 leaves for a crypto wallet at 01:36; CASE_P05 lands at 01:50
#   02:41  A: a customer of Bank Y (ending 4417), a first-time payer, pays P10 Rs 48,000: held at once (Rs 35,000 in
#          current SOP mode: the room left under CASE_P01), pre-alert sent automatically; the payer says it was fraud at
#          04:10 and their own complaint, CASE_P03, lands at 05:30 and links to the money already held
#   03:15  C: Kavitha, a customer of Bank X, pays P10 Rs 15,000: held, a fraud-team call task; at 08:20 she says it was
#          for a second-hand phone: a release waits for the officer
#   03:50  D: P07 (flagged) pays P10 Rs 20,000: held and recorded as layering, no pre-alert
#   04:20  B: a customer of Bank Z (ending 9021), a first-time payer, pays P20 Rs 1,20,000: held; P20 is a Fast mover, so
#          the pre-alert waits for the officer's click at the 09:00 check
#   05:05  F: P20's regular payer sends Rs 3,000: passes the checks, nothing held
#   07:30  E: (data/demo_case.yaml) a new customer pays Murugan Rs 2,400: an Ordinary customer, nothing held
#   G      nobody answers D's hold: day 30 the referral is drafted, day 50 the must-decide alert, day 60 it is released
#          at the limit (python -m pipeline.night --until "2026-12-18 00:00:00" --no-reset). B's holder explains on
#          day 12, so B's decision is due on day 22.
