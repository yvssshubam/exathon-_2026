# The demo night: a cyber-fraud ticket reaches Bank X at 2:13 a.m.; the officer reads the morning log at 9 a.m.
# Invented people and numbers. Synthetic, MIT. IDs are stable: tests, the video and the deck depend on them.
# Amounts are rupees. Times are IST (Asia/Kolkata), stored without zone.
#
# Three banks (config/banks.yaml). Bank X and Bank Y run the agent; Bank Z has a human desk that opens at 10 a.m.
# Each bank's schema gets only the rows that touch its own accounts (pipeline/load_cases.py).
#   Bank X: A and C (mule-like), Murugan's fuel pump D, E (paid by A and C before), K (receives the bad-ticket money)
#   Bank Y: B (A's onward hop), Ravi (victim 2), a diesel customer
#   Bank Z: Lakshmi (victim 1), G (B's onward hop), F (where A tries to send money at 5:10), Meena (victim 3)
#
# The transactions are what happens if nobody acts on the tickets until the desks open (the Compare screen replays
# them). With the agent, the holds refuse some of them: the simulated core banking records those as declined
# attempts instead (DECLINED_ATTEMPT), and they never happen.
#
# The night, as the demo script tells it (docs/DESIGN.md, "Demo"):
#   02:13  the ticket lands at Bank X; the agent holds on A, C and D, files the ATM exit, Bank Y's onward entry and the
#          KYC packets, and proposes narrowing D to the victim's ₹500
#   02:17  Bank Y's agent works the onward ticket: B still has ₹40,000; B's ₹30,000 hop to G at Bank Z is filed on
#   03:20  a ticket with a UTR one digit off: no hold, sent back at once, the near match queued for the officer
#   03:40  G cashes out at Bank Z: its desk is closed until 10 a.m.
#   04:30  C tries the ATM; the hold refuses it; the agent proposes a full freeze on C
#   04:31  C tries to send the money to E (same bank) by UPI; refused; E goes on the watch with no hold
#   05:10  A tries to send ₹50,000 to F at Bank Z; refused; recorded for the police
#   05:45  Ravi (victim 2) pays A ₹40,000: held as money not linked to a reported victim yet
#   06:00  Ravi's ticket lands on A: the held money is linked to him, the split recorded, the total held unchanged
#   07:00  B tries the ATM at Bank Y; refused there
#   07:30  a customer pays Murugan for diesel: an honest receiver's new money, not held
#   09:00  three decisions wait for the officer at Bank X: narrow D, freeze C, the unmatched ticket
#   21 Oct an investigating officer's notice after an FIR repeats CASE_DEMO's transaction: linked, the hold confirmed

