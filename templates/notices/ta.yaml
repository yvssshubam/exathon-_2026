authority_B: "அசாதாரண பரிவர்த்தனைகள் காரணமாக $bank_name தானாகவே (RBI வரைவு விதிகள், இன்னும் நடைமுறைக்கு வரவில்லை)."
basis_label: "சட்ட அடிப்படை"
do_label: "நீங்கள் என்ன செய்யலாம்"
respond_A: "இது தவறு என்று நினைத்தால், விளக்கத்துடனும் ஏதேனும் ஆதாரத்துடனும் (எ.கா. விற்பனை ரசீது) உங்கள் கிளைக்கு வாருங்கள். உங்கள் புகார் கிடைத்த 7 நாட்களுக்குள் வங்கி அதைக் காவல்துறை தளத்துக்கு அனுப்பும்."
respond_B: "20 நாட்களுக்குள், $respond_by க்குள், நீங்கள் விளக்கம் அளிக்கலாம். உங்கள் விளக்கம் கிடைத்த 10 நாட்களுக்குள் வங்கி முடிவெடுக்கும்."
grievance_label: "குறைதீர் அலுவலர்"
closing_amount: "இந்த அறிவிப்பு உங்கள் மீது மோசடிக் குற்றச்சாட்டு அல்ல. நிறுத்திவைக்கப்பட்ட தொகை தவிர உங்கள் கணக்கு பயன்பாட்டில் இருக்கும்."
closing_account: "இந்த அறிவிப்பு உங்கள் மீது மோசடிக் குற்றச்சாட்டு அல்ல. எப்போது வேண்டுமானாலும் இந்த நிறுத்திவைப்பை மறுஆய்வு செய்யக் கோரலாம்."