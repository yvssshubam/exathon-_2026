scope_account: "கடைசி வழியாக, உங்கள் முழுக் கணக்கும் நிறுத்திவைக்கப்பட்டுள்ளது."
why_label: "ஏன்"
reason_amount: "நீங்கள் பெற்ற ஒரு பணம் பதிவுசெய்யப்பட்ட இணைய மோசடியுடன் தொடர்புடையது. அத்தகைய பணத்தைப் பெற்றதால் மட்டும் நீங்கள் தவறு செய்தீர்கள் என்று பொருளல்ல; சரிபார்ப்பு முடியும் வரை இந்தத் தொகை மட்டுமே நிறுத்திவைக்கப்பட்டுள்ளது."
reason_account: "மோசடிப் பணத்தை முன்னே அனுப்புவதற்கு இந்தக் கணக்கு பயன்படுத்தப்பட்ட அறிகுறிகள் உள்ளன: $signals"
who_label: "யாருடைய கோரிக்கையின் பேரில்"
