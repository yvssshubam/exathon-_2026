# Hand-checked answers for CASE_DEMO at tool_as_of (LIBR), over the whole synthetic world (the narrator's view).
# tests/test_oracle_demo.py asserts these.
#   A sent 70,000 to B and 80,000 to C; 50,000 of the victim's money is still there.
#   B (Bank Y) sent 30,000 on to G (Bank Z) at 02:01 and kept 40,000.
#   C had 500 of its own; under LIBR its own money left first, inside the 1,000 diesel payment to D.
#   So of D's 1,000 credit only 500 is the victim's. D's own 8,19,000 never mixes with it.
expected_libr:
  ACC_A: 50000.00
  ACC_B: 40000.00
  ACC_G: 30000.00
  ACC_C: 29500.00
  ACC_D: 500.00
  "EXIT:ATM:BX-ATM-0042": 50000.00
  total: 200000.00

# The same, as Bank X sees it: only its own accounts' transactions. B's hop to G happened at Bank Y, so Bank X sees
# all 70,000 still at B (Bank Y's agent finds the rest).
expected_libr_bank_x:
  ACC_A: 50000.00
  ACC_B: 70000.00
  ACC_C: 29500.00
  ACC_D: 500.00
  "EXIT:ATM:BX-ATM-0042": 50000.00
  total: 200000.00

# What the agent does at 2:13 a.m. at Bank X (rules in config/rules.yaml; tests/rules_oracle.py checks them).
expected_actions:
  ACC_A: {automatic: MANDATORY_HOLD, amount_inr: 50000.00}
  ACC_B: {automatic: ONWARD_ENTRY, amount_inr: 70000.00}
  ACC_C: {automatic: MANDATORY_HOLD, amount_inr: 29500.00}
  ACC_D: {automatic: MANDATORY_HOLD, amount_inr: 1000.00, officer: PROPOSE_NARROW, proposed_inr: 500.00}
  "EXIT:ATM:BX-ATM-0042": {automatic: RECORD_EXIT, amount_inr: 50000.00}

# The officer's 9 a.m. view at Bank X: exactly these wait; everything else is in the morning log.
expected_morning:
  - {case_id: CASE_DEMO, account_id: ACC_D, action_code: PROPOSE_NARROW, amount_inr: 500.00}
  - {case_id: CASE_DEMO, account_id: ACC_C, action_code: PROPOSE_FULL_FREEZE}
  - {case_id: CASE_BADUTR, account_id: ACC_K, action_code: UNMATCHED_NOTICE, amount_inr: 25000.00}

# Today vs the tool, on the same transactions (Compare screen). Bank X's view of CASE_DEMO.
expected_compare:
  victim_money_held: {today: 500.00, tool: 80000.00}
  minutes_ticket_to_first_hold: {today: 487, tool: 3}

# How today's desk works (FR-14 baseline): nothing happens until the desk opens; then each account on the trail
# is looked up in turn, and every account named in the trail is debit-frozen whole (the over-freeze incentive).
today:
  desk_opens: "2026-10-18 10:00:00"
  first_lookup_minutes: 20        # ticket read, passed to the core banking team, UTR found: A actioned 10:20
  per_account_minutes: 15         # each further account on the trail takes this long
  freezes_whole_account: true